<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Каркас-Проект</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script type="module">import * as T from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js";window.THREE=T;window.dispatchEvent(new Event("three-ready"))</script>
<style>
/* Layout: инженерный пульт — колонка параметров слева, рабочее поле с вкладками справа; чертежи всегда на белой бумаге */
:root{
  --bg:#EDF0EC; --panel:#FBFCFA; --ink:#17201C; --muted:#5B6862; --line:#D2D9D3; --soft:#E3E9E4;
  --accent:#2D6A4F; --accent-ink:#FFFFFF; --timber:#B5772D;
  --ok:#2E7D4F; --warn:#9A620F; --bad:#BE3B28; --okbg:#E1F0E6; --warnbg:#F6EBD6; --badbg:#F7E0DB; --infobg:#E3EBF0; --info:#2F5C78;
  --scene:#DCE3DE; --paper:#FFFFFF;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111614; --panel:#171D1A; --ink:#E3E9E5; --muted:#97A59E; --line:#2B3530; --soft:#1F2723;
    --accent:#62B98F; --accent-ink:#0C1310; --timber:#D9A35E;
    --ok:#5FBF89; --warn:#E3A84E; --bad:#F07C66; --okbg:#173022; --warnbg:#33281A; --badbg:#3A1F1A; --infobg:#1B2A33; --info:#8EC1DE;
    --scene:#1A211E; --paper:#FFFFFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --panel:#171D1A; --ink:#E3E9E5; --muted:#97A59E; --line:#2B3530; --soft:#1F2723;
  --accent:#62B98F; --accent-ink:#0C1310; --timber:#D9A35E;
  --ok:#5FBF89; --warn:#E3A84E; --bad:#F07C66; --okbg:#173022; --warnbg:#33281A; --badbg:#3A1F1A; --infobg:#1B2A33; --info:#8EC1DE;
  --scene:#1A211E; --paper:#FFFFFF; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand svg{flex:none}
.brand b{font-size:16px;letter-spacing:.01em;display:block}
.brand span{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.kpis{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.hbtns{display:flex;gap:4px}
.hbtns .btn:disabled{opacity:.4;cursor:default}
.start{display:flex;flex-direction:column;gap:6px;padding:4px 0 12px;border-bottom:1px solid var(--line)}
.start label{font-weight:600;font-size:13px}
.start select{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:5px 8px}
.start .btns{flex-wrap:nowrap}
.sitecard{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--bg);min-width:0}
.kpi small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:var(--f-mono);font-weight:500;font-size:13.5px;font-variant-numeric:tabular-nums}
.kpi.ok b{color:var(--ok)} .kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)}

.shell{display:grid;grid-template-columns:360px minmax(0,1fr);gap:0;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);max-height:calc(100vh - 62px);overflow:auto;border-right:1px solid var(--line);background:var(--panel);
  padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px}
main{min-width:0;padding-block:12px 40px;padding-left:18px;padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .kpis{margin-left:0;width:100%}
}

/* side form */
details.grp{border-bottom:1px solid var(--line);padding-block:4px}
details.grp>summary{list-style:none;cursor:pointer;padding:8px 0;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details.grp[open]>summary::after{content:"−"}
details.grp>summary small{color:var(--muted);font-weight:400;font-size:12px;margin-left:auto;margin-right:6px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding-bottom:12px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted);line-height:1.25}
.fld .inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden}
.fld .inp:focus-within{border-color:var(--accent)}
.fld input,.fld select{border:0;background:transparent;padding:6px 8px;width:100%;min-width:0;font-family:var(--f-mono);font-size:13px}
.fld input[type=text]{font-family:var(--f-ui)}
.fld select{font-family:var(--f-ui);font-size:13px}
.fld .u{padding-right:8px;color:var(--muted);font-size:11.5px;white-space:nowrap}
.fld.chk{flex-direction:row;align-items:center;gap:8px;grid-column:1/-1}
.fld.chk label{color:var(--ink);font-size:13px}
.hint{font-size:11.5px;color:var(--muted);grid-column:1/-1;margin-top:-2px}
.rows{display:flex;flex-direction:column;gap:6px;padding-bottom:10px}
.row{display:grid;gap:4px;align-items:end;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px}
.row.op{grid-template-columns:repeat(4,minmax(0,1fr)) 26px}
.row.op .s2{grid-column:span 2}
.row.iw{grid-template-columns:1fr .9fr .9fr .9fr .7fr 26px}
.row label{font-size:10.5px;color:var(--muted);display:block}
.row input,.row select{width:100%;min-width:0;border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:4px 4px;font-family:var(--f-mono);font-size:12px}
.row select{font-family:var(--f-ui)}
.row .err{grid-column:1/-1;color:var(--bad);font-size:11.5px}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px}
.x:hover{color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
textarea.json{width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--f-mono);font-size:11.5px;padding:6px}
.note{font-size:12px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:transparent;padding:9px 14px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .cnt{font-family:var(--f-mono);font-size:11px;border-radius:9px;padding:0 6px;margin-left:5px;background:var(--soft)}
.tabs button .cnt.bad{background:var(--badbg);color:var(--bad)}
.tabs button .cnt.warn{background:var(--warnbg);color:var(--warn)}
section.tab{min-width:0}
h2{font-size:18px;margin:4px 0 10px;text-wrap:balance}
h3{font-size:15px;margin:18px 0 8px}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.lead{color:var(--muted);max-width:70ch;margin:0 0 12px}

/* 3d */
.viewer{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--scene);height:min(68vh,680px);min-height:380px}
.viewer canvas{display:block;width:100%;height:100%;touch-action:none}
.layers{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.chip i{width:10px;height:10px;border-radius:2px;display:inline-block}
.chip[aria-pressed=false]{opacity:.5}
.chip[aria-pressed=false] i{background:transparent!important;border:1px solid var(--muted)}
.vinfo{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px;max-width:calc(100% - 20px)}
.vhelp{position:absolute;right:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11.5px;color:var(--muted)}
.vbtns{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:11.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em;background:var(--soft);position:sticky;top:0}
table.t td.n,table.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.g td{background:var(--soft);font-weight:600}
table.t tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.mk{font-family:var(--f-mono);font-weight:500;color:var(--timber)}

/* cutting */
.cut{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px;margin-bottom:12px}
.cut-h{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.cut-h b{font-size:15px}
.cut-h .s{color:var(--muted);font-size:12.5px}
.pat{display:grid;grid-template-columns:76px minmax(0,1fr) 46px;gap:8px;align-items:center;margin-top:6px;font-size:12px}
.pat .bar{display:flex;height:22px;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:repeating-linear-gradient(45deg,var(--soft) 0 4px,var(--bg) 4px 8px)}
.pat .bar span{background:color-mix(in srgb,var(--timber) 32%,var(--panel));border-right:2px solid var(--panel);display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;font-family:var(--f-mono);font-size:10.5px;min-width:0}
.pat .lbl{font-family:var(--f-mono);color:var(--muted)}
.pat .q{font-family:var(--f-mono);text-align:right;font-weight:500}
.more{font-size:12px;color:var(--muted);margin-top:6px}

/* checks */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px;min-width:0;display:flex;flex-direction:column;gap:8px}
.card-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card-h b{font-size:14.5px}
.pill{font-size:11.5px;border-radius:999px;padding:2px 8px;white-space:nowrap;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.info{background:var(--infobg);color:var(--info)}
.meta{font-size:12.5px;color:var(--muted)}
.ubar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.ubar i{display:block;height:100%;background:var(--ok)}
.ubar.warn i{background:var(--warn)} .ubar.bad i{background:var(--bad)}
dl.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin:0;font-size:12.5px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}

/* advice */
.adv{display:flex;flex-direction:column;gap:8px}
.ad{border:1px solid var(--line);border-left-width:4px;border-radius:6px;background:var(--panel);padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.ad.bad{border-left-color:var(--bad)} .ad.warn{border-left-color:var(--warn)} .ad.info{border-left-color:var(--info)} .ad.ok{border-left-color:var(--ok)}
.ad b{display:block;margin-bottom:2px}
.ad p{margin:0;color:var(--muted);font-size:13px;max-width:80ch}
.kb{columns:2 340px;column-gap:16px}
.kb details{break-inside:avoid;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:8px 12px;margin-bottom:12px}
.kb summary{font-weight:600;cursor:pointer}
.kb ul{margin:8px 0 2px;padding-left:18px}
.kb li{margin-bottom:6px;font-size:13px}

/* sheets */
.sheet-list{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sheet-list button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;font-size:12.5px;text-align:left}
.sheet-list button b{font-family:var(--f-mono);font-weight:500;margin-right:6px;color:var(--timber)}
.sheet-list button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:auto;box-shadow:0 1px 3px rgb(0 0 0 / .08)}
.paper svg{display:block;width:100%;min-width:760px;height:auto}
.zoom{display:flex;gap:6px;align-items:center}

#print-area{display:none}
/* база знаний */
.kbw{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.kbw{grid-template-columns:1fr}}
.kbtoc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);max-height:calc(100vh - 90px);overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px}
@media (max-width:1100px){.kbtoc{position:static;max-height:none}}
.kbtoc input{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:6px 8px;margin-bottom:8px}
.kbtoc ol{margin:0;padding-left:20px;font-size:13px}
.kbtoc>ol{list-style:none;padding-left:0}
.kbtoc li{margin:3px 0}
.kbtoc a{color:var(--ink);text-decoration:none}
.kbtoc a:hover{color:var(--accent)}
.kbtoc ol ol{padding-left:14px;font-size:12px;color:var(--muted)}
.kbtoc ol ol a{color:var(--muted)}
.kbbody{min-width:0;max-width:880px}
.kbch{margin-bottom:28px}
.kbch>h2{font-size:21px;border-bottom:2px solid var(--accent);padding-bottom:6px}
.kbsec{margin:16px 0 20px}
.kbsec h3{font-size:16px;margin:0 0 6px}
.kbsec p,.kbsec li{font-size:14px;line-height:1.6;max-width:75ch}
.kbsec ul,.kbsec ol{padding-left:20px}
.kbsec table{border-collapse:collapse;font-size:13px;margin:8px 0;width:100%;display:block;overflow-x:auto}
.kbw>*{min-width:0}
.kbsec{overflow-wrap:anywhere}
.kbsec th,.kbsec td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.kbsec th{background:var(--soft)}
.kbsec .f{font-family:var(--f-mono);font-size:13px;background:var(--soft);border-radius:4px;padding:6px 10px;display:block;margin:6px 0;overflow-x:auto;white-space:pre-wrap}
.kbsec .src{font-size:12px;color:var(--muted);margin-top:6px}
.kbsec .src a{color:var(--muted)}
.kbsec .pdf{border-left:3px solid #4a6fd0;background:var(--soft);padding:6px 10px;border-radius:0 6px 6px 0;font-size:13px;margin:8px 0}
.kbfig{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0;overflow-x:auto}
.kbfig svg{display:block;width:100%;max-width:640px;height:auto;margin:0 auto}
.kbfig figcaption{font-size:12px;color:#555;text-align:center;margin-top:4px}
.kbfigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
mark{background:color-mix(in srgb,var(--warn) 30%,transparent);color:inherit}
@media print{
  @page{size:A3 landscape;margin:0}
  body{background:#fff}
  body::before{display:none}
  .top,.shell{display:none!important}
  #print-area{display:block!important}
  #print-area .psheet{width:420mm;height:297mm;page-break-after:always;break-after:page;overflow:hidden}
  #print-area .psheet svg{width:420mm;height:297mm}
  #print-area .ptab{padding:12mm;page-break-after:always;color:#000;font-size:10pt}
  #print-area table{border-collapse:collapse;width:100%}
  #print-area td,#print-area th{border:0.2mm solid #000;padding:1mm 2mm;font-size:9pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="7" fill="var(--accent)"/><path d="M7 17 17 9l10 8M10 15v10h14V15M14 25v-6h6v6" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linejoin="round"/><path d="M9 28h16" stroke="var(--accent-ink)" stroke-width="1.6" stroke-dasharray="2 2"/></svg>
    <div><b>Каркас-Проект</b><span id="pname"></span></div>
  </div>
  <div class="hbtns"><button class="btn sm" id="undo" title="Отменить (Ctrl+Z)" aria-label="Отменить">↶ Отменить</button><button class="btn sm" id="redo" title="Повторить (Ctrl+Y)" aria-label="Повторить">↷</button></div>
  <div class="kpis" id="kpis"></div>
</header>

<div class="shell">
  <aside id="side" aria-label="Параметры проекта"></aside>
  <main>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <section class="tab" id="tab-3d"></section>
    <section class="tab" id="tab-draw" hidden></section>
    <section class="tab" id="tab-spec" hidden></section>
    <section class="tab" id="tab-cut" hidden></section>
    <section class="tab" id="tab-calc" hidden></section>
    <section class="tab" id="tab-adv" hidden></section>
    <section class="tab" id="tab-db" hidden></section>
    <section class="tab" id="tab-kb" hidden></section>
  </main>
</div>
<div id="print-area"></div>

<script>
'use strict';
/* =========================================================================
   Каркас-Проект — проектирование каркасного дома на сваях (винтовых и железобетонных).
   Единицы: геометрия — мм, нагрузки — кПа (кН/м²), погонные — кН/м (= Н/мм).
   ========================================================================= */
const $=s=>document.querySelector(s);
const R=Math.round, rad=a=>a*Math.PI/180;

  else if(t.kind==='manual'){r.Nperm=+P.pileFd;r.Fd=r.Nperm*1.4;r.u=Math.PI*t.d/1000;r.anchor=r.Nperm*.5;r.method='Значение из паспорта / геологии'}

  else{const dv=t.kind==='driven',As=dv?(t.a/1000)**2:Math.PI*(t.d/1000)**2/4,A=dv?As:Math.PI*((t.base||t.d)/1000)**2/4,u=dv?4*t.a/1000:Math.PI*t.d/1000;
    const R=Rtip((dv?R_DRIVEN:R_BORED)[soil.R],h),gcf=dv?1:.7,tip=R*A,fr=u*gcf*fSum(F_SIDE[soil.f],Math.min(1,h),h);
    Object.assign(r,{R,A,u,tip,fr,gcf,Fd:tip+fr,Nperm:(tip+fr)/1.4,method:dv?'СП 24.13330, забивная свая: Fd = R·A + u·Σγcf·fi·hi':'СП 24.13330, буронабивная: Fd = R·A + u·Σγcf·fi·hi, γcf = 0,7'});
    r.anchor=u*gcf*fSum(F_SIDE[soil.f],Math.min(df,h),h)+(t.base?.5*R*(A-As):0)}

}

const DXF_LAYERS={MAIN:[7,'CONTINUOUS'],THIN:[8,'CONTINUOUS'],AXIS:[1,'DASHDOT'],HIDDEN:[5,'DASHED'],WOOD:[30,'CONTINUOUS'],LINTEL:[32,'CONTINUOUS'],CONTEXT:[9,'CONTINUOUS'],FRAME:[7,'CONTINUOUS'],TEXT:[7,'CONTINUOUS'],FILL:[250,'CONTINUOUS']};

function cp1251(str){const out=new Uint8Array(str.length);for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);let b;
  if(c<128)b=c;else if(c>=0x410&&c<=0x44f)b=c-0x410+0xC0;else{const j=CP1251_HI.indexOf(str[i]);b=j>=0?0x80+j:0x3F}out[i]=b}return out}
/* лист → DXF R12: геометрия в натуральную величину (мм), рамка и текст увеличены в масштаб листа */
function sheetDxf(sh){
  const k=sh.scale,host=document.createElement('div');host.style.cssText='position:absolute;left:-20000px;top:0;width:1600px;visibility:hidden';host.innerHTML=sh.svg;document.body.appendChild(host);
  const svg=host.querySelector('svg'),E=[],X=x=>(+x*k).toFixed(3),Y=y=>((297-+y)*k).toFixed(3);
  const poly=(pts,ly,closed)=>{E.push('0','POLYLINE','8',ly,'66','1','70',closed?'1':'0','10','0','20','0','30','0');pts.forEach(([x,y])=>E.push('0','VERTEX','8',ly,'10',X(x),'20',Y(y),'30','0'));E.push('0','SEQEND','8',ly)};
  svg.querySelectorAll('line,rect,circle,polygon,polyline,path,text').forEach(el=>{
    const cls=el.getAttribute('class')||'';if(cls==='wt')return;const ly=CLS_LAYER[cls]||(el.tagName==='text'?'TEXT':'THIN'),a=n=>+el.getAttribute(n);
    switch(el.tagName){
      case 'line':E.push('0','LINE','8',ly,'10',X(a('x1')),'20',Y(a('y1')),'30','0','11',X(a('x2')),'21',Y(a('y2')),'31','0');break;
      case 'rect':{if(!cls)return;const x=a('x'),y=a('y'),w=a('width'),h=a('height');poly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],ly,true);break}
      case 'circle':E.push('0','CIRCLE','8',ly,'10',X(a('cx')),'20',Y(a('cy')),'30','0','40',(a('r')*k).toFixed(3));break;
      case 'polygon':case 'polyline':{const pts=el.getAttribute('points').trim().split(/\s+/).map(q=>q.split(',').map(Number));poly(pts,ly,el.tagName==='polygon');break}
      case 'path':{let Lp=0;try{Lp=el.getTotalLength()}catch(e){}if(!Lp)return;const n=Math.max(8,Math.ceil(Lp/1.5)),pts=[];for(let i=0;i<=n;i++){const q=el.getPointAtLength(Lp*i/n);pts.push([q.x,q.y])}poly(pts,ly,false);break}
      case 'text':{const tx=el.textContent;if(!tx.trim())return;const x=a('x'),y=a('y'),sz=a('font-size')||2.5,anc=el.getAttribute('text-anchor'),m=/rotate\(([-\d.]+)/.exec(el.getAttribute('transform')||''),rot=m?-(+m[1]):0,al=anc==='middle'?1:anc==='end'?2:0;
        E.push('0','TEXT','8','TEXT','10',X(x),'20',Y(y),'30','0','40',(sz*.7*k).toFixed(3),'1',dxfStr(tx));if(rot)E.push('50',rot.toFixed(2));E.push('7','GOST');if(al)E.push('72',String(al),'11',X(x),'21',Y(y),'31','0');break}
    }});
  host.remove();
  const H=['0','SECTION','2','HEADER','9','$ACADVER','1','AC1009','9','$DWGCODEPAGE','3','ANSI_1251','9','$EXTMIN','10','0','20','0','30','0','9','$EXTMAX','10',(420*k).toFixed(1),'20',(297*k).toFixed(1),'30','0','0','ENDSEC',
    '0','SECTION','2','TABLES','0','TABLE','2','LTYPE','70','3',
    '0','LTYPE','2','CONTINUOUS','70','0','3','Solid line','72','65','73','0','40','0.0',
    '0','LTYPE','2','DASHED','70','0','3','__ __ __','72','65','73','2','40',(3*k).toFixed(3),'49',(2*k).toFixed(3),'49',(-1*k).toFixed(3),
    '0','LTYPE','2','DASHDOT','70','0','3','____ . ____','72','65','73','4','40',(11.4*k).toFixed(3),'49',(8*k).toFixed(3),'49',(-1.2*k).toFixed(3),'49',(1*k).toFixed(3),'49',(-1.2*k).toFixed(3),
    '0','ENDTAB','0','TABLE','2','LAYER','70',String(Object.keys(DXF_LAYERS).length)];
  Object.entries(DXF_LAYERS).forEach(([nm,[c,lt]])=>H.push('0','LAYER','2',nm,'70','0','62',String(c),'6',lt));
  H.push('0','ENDTAB','0','TABLE','2','STYLE','70','1','0','STYLE','2','GOST','70','0','40','0.0','41','0.8','50','15.0','71','0','42',(2.5*k).toFixed(2),'3','arial.ttf','4','','0','ENDTAB','0','ENDSEC','0','SECTION','2','ENTITIES');
  return cp1251([...H,...E,'0','ENDSEC','0','EOF'].join('\r\n')+'\r\n');
}

function parseDB(txt){
  txt=txt.replace(/^\ufeff/,'').trim();
  if(txt[0]==='['){return JSON.parse(txt).map(r=>({t:LUMBER_ALIAS[String(r.t||r.type||'').toLowerCase()]||'edged',b:+r.b,h:+r.h,lens:String(r.lens||'6000'),price:+r.price||+P.prices.wood,use:r.use!==false})).filter(r=>r.b>0&&r.h>0)}
  return txt.split(/\r?\n/).map(l=>{const sep=l.includes(';')?';':l.includes('\t')?'\t':',',c=l.split(sep).map(x=>x.trim());const t=LUMBER_ALIAS[(c[0]||'').toLowerCase().replace(/^доска\s*/,'').replace(/^сухая\s*/,'')];
    if(!t||!(+c[1]>0)||!(+c[2]>0))return null;return {t,b:+c[1],h:+c[2],lens:c[3]||'6000',price:+(c[4]||'').replace(/\s/g,'')||+P.prices.wood,use:!/^(нет|no|0)$/i.test(c[5]||'')}}).filter(Boolean)}

function kbNode(type){
  const W='#E8C48A',FB='#8AA6E8',INS='url(#ins)',COLD='#F4B6B0';
  const R=(x,y,w,h,f,st='#333')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" stroke="${st}" stroke-width="3"/>`;
  const T=(x,y,t,a='start',s=34)=>`<text x="${x}" y="${y}" font-size="${s}" text-anchor="${a}" fill="#222" font-family="Arial,sans-serif">${t}</text>`;
  const L=(x1,y1,x2,y2,c='#333',w=3,da='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${da?`stroke-dasharray="${da}"`:''}/>`;
  const defs=`<defs><pattern id="ins" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="24" height="24" fill="#F7EBB5"/><line x1="0" y1="0" x2="0" y2="24" stroke="#D9C46A" stroke-width="6"/></pattern></defs>`;
  let g='';const out=`${L(-12,-12,1300,-12,'#555',8)}${L(-12,-12,-12,1300,'#555',8)}`;
  if(type==='warm'||type==='cold'){
    g+=R(45,0,555,145,INS)+R(645,0,555,145,INS)+R(0,190,145,510,INS)+R(0,745,145,455,INS);
    g+=R(0,0,45,145,W)+R(600,0,45,145,W)+R(0,145,145,45,W)+R(0,700,145,45,W);
    if(type==='warm'){g+=R(95,100,100,45,FB);g+=L(145,160,1200,160,'#777',6,'18 10')+L(160,190,160,1200,'#777',6,'18 10');
      g+=T(260,250,'доска 45×100 плашмя')+L(255,240,175,140,'#4a6fd0',3)+T(260,470,'полость открыта —')+T(260,510,'утеплитель сплошной')}
    else{g+=R(45,0,100,145,COLD)+R(145,0,45,145,W);g+=L(190,160,1200,160,'#777',6,'18 10')+L(160,190,160,1200,'#777',6,'18 10');
      g+=T(260,250,'дополнительная стойка')+T(260,470,'замкнутая полость без')+T(260,510,'утеплителя — мостик холода')+L(255,460,95,70,'#c0392b',3)}
    g+=T(700,-40,'наружная обшивка / ветрозащита','start',30)+T(560,215,'стена 1','start',30)+T(170,1150,'стена 4','start',30);
  }else{
    g+=R(0,0,1200,145,INS);[[250],[950]].forEach(([x])=>g+=R(x,0,45,145,W));
    g+=R(552,190,96,1010,INS)+R(552,145,96,45,W);
    if(type==='twarm'){g+=R(500,100,100,45,FB)+R(600,100,100,45,FB);g+=T(720,250,'две доски 45×100 плашмя')+L(715,240,650,140,'#4a6fd0',3)+T(720,330,'утеплитель за ними сплошной')}
    else{g+=R(578,0,45,145,W)+R(530,0,45,145,W)+R(625,0,45,145,W);g+=T(720,250,'сквозные стойки на всю толщину')+T(720,300,'стены — мостик холода по дереву')}
    g+=L(0,160,500,160,'#777',6,'18 10')+L(700,160,1200,160,'#777',6,'18 10');
    g+=T(20,-40,'наружная стена','start',30)+T(680,1150,'перегородка','start',30);
  }
  const cap={warm:'Тёплый угол (план)',cold:'Классический угол из 3 стоек (план)',twarm:'Тёплое Т-примыкание перегородки (план)',tcold:'Классическое Т-примыкание (план)'}[type];
  return `<figure class="kbfig"><svg viewBox="-60 -90 1300 1320" role="img" aria-label="${cap}">${defs}${out}${g}</svg><figcaption>${cap}. Синее — доска плашмя, жёлтое — утеплитель, штрих — внутренняя отделка.</figcaption></figure>`;
}
function kbPie(){
  const L=wallLayers(P),cols=['#E9E4D8','#F7EBB5','#C9D7F0','#F7EBB5','#E8C48A','#B9D3B0','#DDE8F0','#D6C2A6'];
  const w=640,h=34*L.length+20;let g='';L.forEach((t,i)=>{g+=`<rect x="10" y="${10+i*34}" width="60" height="30" fill="${cols[i%cols.length]}" stroke="#333"/><text x="84" y="${30+i*34}" font-size="15" font-family="Arial,sans-serif" fill="#222">${i+1}. ${esc(t)}</text>`});
  return `<figure class="kbfig"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Состав стены">${g}</svg><figcaption>Состав наружной стены текущего проекта (изнутри наружу) — меняется вместе с технологией и настройками.</figcaption></figure>`;
}
const PDFN=t=>`<div class="pdf"><b>Из проекта 26АГ300 (PDF проектировщика):</b> ${t}</div>`;
function KBOOK(){return [
 {id:'k1',t:'1. Как работать с конструктором',s:[
  {t:'Порядок заполнения',h:`<ol><li><b>Местоположение</b> — город: программа подгружает снег, ветер и глубину промерзания (офлайн-файл, нужен интернет).</li><li><b>Технология и размеры</b> — канадская, финская (скандинавская) или свободная; тип пиломатериала; габариты.</li><li><b>Фундамент и пол</b> — тип свай, грунт, ростверк (брус или пакет досок), лаги.</li><li><b>Каркас стен</b> — сечение и шаг стоек, обвязка, углы, жёсткость (укосины или обшивка).</li><li><b>Окна и двери</b>, <b>перегородки</b>.</li><li><b>Кровля</b> — тип, уклон, покрытие, мансарда.</li><li><b>Климат и нагрузки</b> — проверка и ручная правка.</li></ol><p>После каждого изменения программа пересобирает модель, пересчитывает нагрузки и проверки, раскрой, смету и чертежи. Если элемент не проходит, кнопка «Исправить всё автоматически» подбирает минимальные сечения из базы материалов в рамках выбранной технологии.</p>`},
  {t:'Что программа считает и чего не делает',h:`<p>Считает: вертикальные нагрузки (кровля, снег, перекрытия, стены), горизонтальные (ветер), прочность и прогиб стропил, балок, лаг, бруса ростверка, перемычек, устойчивость стоек, несущую способность и пучение свай, жёсткость стен, анкеровку, опрокидывание, отрыв кровли; спецификацию, раскрой, смету, рабочие чертежи.</p><p><b>Ограничения:</b> расчёт упрощённый (однородный грунт, прямоугольный план, один этаж с мансардой или чердаком, снеговые мешки и сейсмика не учитываются). Это инструмент подбора сечений и подготовки к стройке — финальный проект согласуйте с инженером.</p>`,src:['sp20','sp64']}
 ]},
 {id:'k2',t:'2. Технологии каркасного строительства',s:[
  {t:'Названия: финская = скандинавская',h:`<p>«Финская» и «скандинавская» технология — <b>одно и то же</b>: каркас из сухой строганой доски с «дышащей» стеной, распространённый в Финляндии, Швеции и Норвегии. «Канадская» — отдельная технология, платформенный каркас (platform frame). В рекламе часть компаний называет «канадской» сборку из СИП-панелей — это другая технология (сэндвич-панели OSB + пенополистирол), к каркасу из досок она не относится и в конструкторе не используется.</p><p>Встречается и «немецкая» технология — это скорее способ производства: стеновые панели заводской готовности. Её конструктив близок к канадскому или финскому.</p>`,src:['a_enter','a_mechta','a_volog','a_rubl']},
  {t:'Канадская (платформенная)',h:`<ul><li>Сначала собирается перекрытие-«платформа», на ней лёжа собирают стены и поднимают.</li><li>Шаг стоек 400 мм (16″), допускается 600 мм.</li><li>Верхняя обвязка двойная, стыки досок разнесены, вторая доска перекрывает углы и связывает стены.</li><li>Над проёмами — перемычка-хедер из двух досок на ребро на сдвоенных (опорных) стойках.</li><li>Жёсткость — сплошная обшивка OSB-3 или фанерой снаружи, укосины не нужны.</li><li>Снаружи — ветро-влагозащитная мембрана, вентзазор, сайдинг; изнутри — пароизоляция. Стена плотная, нужна приточно-вытяжная вентиляция.</li></ul>`,src:['sp31105','a_enter','a_rubl']},
  {t:'Финская (скандинавская)',h:`<ul><li>Каркас из сухой строганой калиброванной доски.</li><li>Шаг стоек: классический финский — 600 мм под плиты утеплителя 565 мм; в России при плитах 600 мм — <b>635 мм по осям, 590 в свету</b>.</li><li>Верхняя обвязка одинарная, поэтому балки и стропила ставятся строго над стойками.</li><li>Над проёмом — ригель (перемычка), жёсткость — врезные раскосы (укосины).</li><li>Снаружи — ветрозащитная плита (мягкая ДВП 25 мм), вентзазор, фасадная доска. Изнутри — пароизоляция и инсталляционный слой 50 мм на обрешётке 45×45 для проводки.</li><li>Стена «дышит»: влага уходит через паропроницаемую ветрозащиту в вентзазор.</li></ul>${PDFN('стойки 45×145, «шаг стоек наружных стен в свету 590 мм» (лист 2), врезные раскосы 25×150 (листы 17–26). Это российская адаптация финского каркаса под плиты 600 мм.')}`,src:['a_olla','a_brutal','a_mechta','pdf']},
  {t:'Сравнение',h:`<table><tr><th></th><th>Канадская</th><th>Финская (скандинавская)</th></tr><tr><td>Шаг стоек</td><td>400 (600)</td><td>600 / 635</td></tr><tr><td>Верхняя обвязка</td><td>двойная</td><td>одинарная, балки над стойками</td></tr><tr><td>Над проёмом</td><td>хедер, сдвоенные стойки</td><td>ригель</td></tr><tr><td>Жёсткость</td><td>сплошная обшивка OSB/фанера</td><td>врезные укосины</td></tr><tr><td>Снаружи</td><td>мембрана</td><td>ветрозащитная ДВП</td></tr><tr><td>Изнутри</td><td>пароизоляция</td><td>пароизоляция + инсталляционный слой 50 мм</td></tr><tr><td>Пиломатериал</td><td>строганая или обрезная</td><td>только сухая строганая</td></tr><tr><td>Характер стены</td><td>плотная, нужна вентиляция</td><td>«дышащая»</td></tr></table><p>Источники сходятся в главном: различие не столько в составе слоёв, сколько в устройстве силового каркаса (обвязка, хедеры, способ обеспечения жёсткости).</p>`,src:['a_enter','a_mechta','a_stroi']},
  {t:'Как технология работает в конструкторе',h:`<p>При выборе технологии программа выставляет её параметры и закрывает их значком 🔒; в списках остаются только допустимые варианты. Автоподбор сечений тоже не выходит за её рамки. «Свободная» технология снимает все ограничения.</p>`}
 ]},
 {id:'k3',t:'3. Пиломатериал',s:[
  {t:'Сухая строганая и сухая обрезная доска',h:`<p><b>Сухая строганая (калиброванная)</b> — доска камерной сушки (влажность 12–18 %), острожена с четырёх сторон до точного размера: из 50×150 получается 45×145, из 50×200 — 45×195. Одинаковая толщина всех стоек даёт ровную стену без подгонки, меньше коробления.</p><p><b>Сухая обрезная</b> — тоже камерной сушки, но не строганая: размер номинальный (50×150), возможен разброс по толщине и ширине на несколько миллиметров. Дешевле, но требует отбора доски и подгонки.</p><p>Для несущих элементов — сорт 1–2 по ГОСТ 8486-86, влажность не выше 20 %. Сырой пиломатериал в каркасе даёт усадку, щели и трещины отделки.</p>`,src:['gost8486','gost24454','sp31105']},
  {t:'Сечения и где они применяются',h:`<table><tr><th>Элемент</th><th>Строганая</th><th>Обрезная</th></tr><tr><td>Стойки наружных стен</td><td>45×145, 45×195</td><td>50×150, 50×200</td></tr><tr><td>Стойки перегородок</td><td>45×95</td><td>50×100</td></tr><tr><td>Лаги, балки, стропила, перемычки</td><td>45×195, 45×220, 45×245</td><td>50×200, 50×250</td></tr><tr><td>Доска тёплого угла (плашмя)</td><td>45×95…45×120</td><td>50×100</td></tr><tr><td>Укосины врезные</td><td colspan="2">25×100…25×150 обрезная</td></tr><tr><td>Обрешётка / контробрешётка</td><td colspan="2">25×100 / 50×50 обрезная</td></tr><tr><td>Обвязка свай</td><td>пакет 45×195</td><td>брус 150×150…150×200</td></tr></table>${PDFN('используются 45×145 (стойки), 45×195 (балки, перемычки, обвязка свай), 100×45 (перегородки и доски тёплых углов), 25×150 (раскосы) — всё сухой строганый пиломатериал (лист 34).')}`,src:['pdf','gost24454']},
  {t:'База материалов и автоподбор',h:`<p>Вкладка «База материалов» — список доступных сечений с длинами и ценами. Программа подбирает сечения только из позиций «в наличии» и только выбранного типа доски. При смене типа доски все сечения заменяются на ближайшие и сразу проверяются расчётом. Длины в базе используются в раскрое, цены — в смете.</p>`},
  {t:'Защита древесины',h:`<p>Всё, что ниже 50 см от земли и в контакте с бетоном или металлом, обрабатывают антисептиком обязательно (2 слоя, ≈25 л на 1 м³). Между оголовком сваи и обвязкой — 2 слоя рубероида по ГОСТ 10923-93.</p>${PDFN('во всех узлах обвязки свай (Ф3.01–Ф3.08) между оголовком и доской — рубероид ГОСТ 10923-93.')}`,src:['gost10923','pdf']}
 ]},
 {id:'k4',t:'4. Нагрузки',s:[
  {t:'Виды нагрузок и коэффициенты надёжности',h:`<p><b>Постоянные</b> — собственный вес конструкций (γf = 1,1 для дерева, 1,2 для утеплителя и отделки). <b>Временные</b> — полезная на перекрытия (γf = 1,3 при нормативной менее 2 кПа), снег (γf = 1,4), ветер (γf = 1,4). Расчётная нагрузка = нормативная × γf. При одновременном действии снега и ветра — коэффициент сочетания 0,9.</p><table><tr><th>Нагрузка</th><th>Нормативная</th></tr><tr><td>Полезная на пол жилого дома</td><td>1,5 кПа (150 кг/м²)</td></tr><tr><td>Чердак холодный</td><td>0,7 кПа</td></tr><tr><td>Мансарда (как жилое)</td><td>1,5 кПа</td></tr></table>`,src:['sp20']},
  {t:'Снеговая нагрузка',h:`<span class="f">S = Sg · μ;   μ = 1 при α ≤ 30°,  μ = (60 − α)/30 при 30° < α < 60°,  μ = 0 при α ≥ 60°</span><table><tr><th>Район</th><th>I</th><th>II</th><th>III</th><th>IV</th><th>V</th><th>VI</th><th>VII</th><th>VIII</th></tr><tr><td>Sg, кПа</td><td>0,5</td><td>1,0</td><td>1,5</td><td>2,0</td><td>2,5</td><td>3,0</td><td>3,5</td><td>4,0</td></tr></table><p>Район берут по карте СП 20.13330. Снеговые мешки у перепадов высот и парапетов конструктор не учитывает.</p>${PDFN('Краснодарский край — снеговой район II, ветровой VI (лист 2).')}`,src:['sp20','pdf']},
  {t:'Ветровая нагрузка',h:`<span class="f">w = w0 · k(z) · c;   k: A — 0,75, B — 0,5, C — 0,4 (для z ≤ 5 м)
c: наветренная стена +0,8, заветренная −0,5 (в сумме 1,3); скат: от 0 до +0,7 по уклону; отсос на кровле −0,6</span><table><tr><th>Район</th><th>Ia</th><th>I</th><th>II</th><th>III</th><th>IV</th><th>V</th><th>VI</th><th>VII</th></tr><tr><td>w0, кПа</td><td>0,17</td><td>0,23</td><td>0,30</td><td>0,38</td><td>0,48</td><td>0,60</td><td>0,73</td><td>0,85</td></tr></table>`,src:['sp20']},
  {t:'Климат по городу',h:`<p>Программа берёт архив погоды Open-Meteo (реанализ ERA5) за 10 полных лет:</p><ul><li><b>Снег</b> — максимум высоты снега за каждую зиму; вес = высота × 300 кг/м³ × g.</li><li><b>Ветер</b> — максимум скорости за каждый год; давление w0 = 0,43·V² (Па).</li><li><b>Глубина промерзания</b> — по СП 22.13330: d = d₀·√Mt, Mt — сумма абсолютных среднемесячных отрицательных температур; d₀ = 0,23 (суглинки, глины), 0,28 (супеси, пески мелкие), 0,30 (пески средние).</li><li><b>Повторяемость 1 раз в 50 лет</b> — распределение Гумбеля: x₅₀ = x̄ + 2,59·σ. Нормы требуют именно её; средние значения годятся только для оценки.</li></ul>`,src:['meteo','sp22','sp20','sp131']},
  {t:'Путь вертикальной нагрузки',h:`<p>Покрытие → обрешётка → стропила → верхняя обвязка и стойки стен (и стенки мансарды) → балки перекрытия → нижняя обвязка → лаги и обвязочная доска → обвязка свай (ростверк) → сваи → грунт. Во вкладке «Расчёт» — таблица нагрузок по уровням и нагрузка на каждую сваю.</p>`},
  {t:'Путь горизонтальной нагрузки',h:`<p>Ветер давит на стены → стены передают его на перекрытие (жёсткий диск) → диск распределяет его на стены, параллельные ветру, пропорционально их жёсткости → стены передают сдвиг через нижнюю обвязку и анкерные уголки на перекрытие → ростверк → сваи. Отдельно проверяются: отрыв торцов стен (анкеры), выдёргивание крайних свай от опрокидывающего момента, отрыв стропил ветровым отсосом.</p>`,src:['sp20','ec5']}
 ]},
 {id:'k5',t:'5. Фундамент и обвязка свай',s:[
  {t:'Винтовые сваи',h:`<p>Несущая способность — по таблицам производителей с поправкой на грунт. Лопасть заглубляют ниже промерзания минимум на 300 мм. Анкеровка против пучения — лопасть плюс трение ствола ниже зоны промерзания. Перед стройкой — пробное завинчивание: длину определяет плотный слой, а не каталог.</p>`},
  {t:'Железобетонные сваи',h:`<span class="f">Fd = γc · (γcR·R·A + u·Σ γcf·fi·hi);   N ≤ Fd / γk,  γk = 1,4</span><p>R — сопротивление под остриём, fi — трение по боковой поверхности (табл. 7.2 и 7.3 СП 24.13330) в зависимости от грунта и глубины. Для забивных γcf = 1, для буронабивных 0,7. Уширение пяты (ТИСЭ) увеличивает площадь A и анкеровку против выдёргивания.</p>`,src:['sp24']},
  {t:'Морозное пучение',h:`<span class="f">τ · u · df − 0,9 · Nпост ≤ Fанкер</span><p>τ — касательные силы пучения (70/90/110 кПа для слабо-, средне-, сильнопучинистых грунтов), df — глубина промерзания. Проверяется самая лёгкая свая (обычно угловая). Гладкая гильза или 2 слоя рубероида на стволе буронабивной сваи снижают силы пучения.</p>`,src:['sp22','sp24']},
  {t:'Обвязка свай: брус или пакет досок «ёлочкой»',h:`<p>Пакет из 2–4 досок на ребро, собранный «ёлочкой» (стыки соседних досок смещены, гвозди — в шахматном порядке), работает как цельная балка, если стыки досок разнесены и приходятся только на сваи. Конструктор раскладывает стыки «вразбежку» — у соседних досок через одну сваю.</p>${PDFN(`<ol><li>Для соединения обвязки в торец пробивают по 3 гвоздя для доски 150 и по 4 для 200. Гвозди в пласть — не ближе 100 мм от края и стыка прогона, до кромки не менее 25 мм.</li><li>Доски между собой — гвоздями 90 мм или шпильками М10 DIN 975 с гайками DIN 934 через шайбы DIN 9021.</li><li>Шаг шпилек — не более 600 мм. Гвозди — с обеих сторон в шахматном порядке, шаг в ряду не более 450 мм.</li><li>К оголовкам обвязка крепится сантехническими болтами 10×140; если обвязка по швеллеру — пакет прибивают к опорной доске, а её крепят к швеллеру болтами 10×60 DIN 975 с шайбами DIN 9021.</li></ol>Узлы: Ф3.01 угловое, Ф3.02 продольное, Ф3.03–3.04 Т-образные, Ф3.05–3.06 Х-образные, Ф3.07–3.08 под непрямым углом (лист 7). Сборка в 4 шага: сначала первая доска контура и все стыки над сваями, затем вторая и третья доски со смещением стыков, затем стяжка шпильками (лист 8).`)}`,src:['pdf','din','gost10923']}
 ]},
 {id:'k6',t:'6. Перекрытие пола',s:[
  {t:'Балки и лаги',h:`<p>Шаг лаг — под лист пола (OSB 22 мм — до 600 мм) и под ширину утеплителя. Пролёт ограничивается прогибом L/250 и прочностью; при больших пролётах ставят промежуточные балки ростверка на сваях (конструктор добавляет их автоматически). Перегородки, идущие вдоль лаг, ставят на сдвоенную лагу.</p>`,src:['sp20','sp64']},
  {t:'Узлы перекрытия',h:PDFN(`<ul><li><b>П1.01</b> — крепление обвязочной доски перекрытия к опорной доске: гвозди с шагом не более 450 мм.</li><li><b>П1.02</b> — то же с закладным лежнем.</li><li><b>П1.03, П1.04</b> — блок-балки (перемычки) под стеной на металлических опорах бруса, при необходимости — с закладным лежнем: стена опирается не на одну балку, а на «лестницу» из блоков.</li><li><b>П1.05</b> — распорки между балками; <b>П1.06</b> — распорки под стеной.</li><li><b>П1.07</b> — соединение балок в торец на опоре с накладной доской; <b>П1.08</b> — продольное соединение на опоре.</li><li><b>П1.09</b> — гвоздевое соединение; <b>П1.10–П1.12</b> — металлические опоры бруса 50 и 100 мм, раздельные опоры с болтом 10×120 DIN 571.</li></ul>`),src:['pdf']},
  {t:'Утепление пола',h:`<p>Снизу — черновой подшив и ветро-влагозащитная мембрана, между лагами — утеплитель на всю высоту, сверху — пароизоляция и черновой пол. Подполье проветривается через продухи в забирке (не менее 1/400 площади).</p>`}
 ]},
 {id:'k7',t:'7. Стены',s:[
  {t:'Шаг стоек: 400, 600, 625 или 635',h:`<ul><li><b>400</b> — канадский стандарт (16″), под лист 1220 мм; высокая жёсткость, больше дерева.</li><li><b>600</b> — финский стандарт под плиту утеплителя 565 мм (при стойке 45 мм в свету 555).</li><li><b>625</b> — под лист OSB 2500×1250: стык листа на стойке; при стойке 50 в свету 575.</li><li><b>635</b> — под российскую плиту 600 мм: при стойке 45 в свету 590, плита встаёт враспор с поджатием 10 мм.</li></ul>${PDFN('шаг 635 по осям / 590 в свету при стойках 45×145 (листы 2, 17–26).')}`,src:['pdf','sp31105']},
  {t:'Обвязки',h:`<p>Нижняя обвязка — по всей длине стены, под дверью вырезается после подъёма стены. Верхняя — одинарная (финская, балки над стойками) или двойная (канадская, стыки разнесены не менее чем на 1,2 м).</p>${PDFN('вторая верхняя обвязка (145×45) монтируется после подъёма стен, перекрывая стыки стеновых панелей и углы (лист 27). Длинные стены для удобства собирают из двух частей и стыкуют на месте (листы 17, 19).')}`,src:['pdf','sp31105']},
  {t:'Проёмы',h:`<p>Над проёмом — перемычка из досок на ребро, опирается на опорные (укороченные) стойки по обе стороны; рядом — полные стойки. Над перемычкой и под подоконным ригелем — укороченные стойки по шагу. Перемычка считается на изгиб от нагрузки кровли и перекрытия.</p>${PDFN('перемычки — 45×195 (марки V), над ними укороченные стойки; подоконный ригель — доска 145×45.')}`,src:['sp64','pdf']},
  {t:'Жёсткость: укосины по СНиП или плитная обшивка',h:`<p><b>Укосины (раскосы)</b> — доска 25×100…25×150, врезанная в стойки снаружи на глубину своей толщины (не больше 1/4 стойки), под углом 45–60° от нижней до верхней обвязки. В каждой стене — укосины обоих направлений, у углов здания. Крепление — по 2 гвоздя в каждую стойку, по 3 — в обвязки. Несущая способность — по сжатию с учётом гибкости и по гвоздевым соединениям (СП 64.13330).</p><p><b>Плитная обшивка</b> — OSB-3, фанера или ЦСП, крепёж по краю листа с шагом 100–150 мм. Работает только сплошной участок стены шириной не менее четверти высоты.</p><p><b>Правило конструктора:</b> если на стене укосина под 45–60° не помещается из-за проёмов, эта стена автоматически получает плитную обшивку.</p>${PDFN('раскосы 25×150 врезные (марки М01–М06), красные на листах 16–26.')}`,src:['sp64','sp31105','ec5','pdf']}
 ]},
 {id:'k8',t:'8. Углы и примыкания: тёплые узлы',s:[
  {t:'Почему классический угол «холодный»',h:`<p>Угол из трёх стоек (торцевая стойка, стойка примыкающей стены и дополнительная стойка для крепления внутренней отделки) образует <b>замкнутую полость</b>, которую невозможно качественно утеплить после сборки. Плюс сплошное дерево на всю толщину стены. В углу теплопотери в 2–3 раза выше, внутренняя поверхность холоднее — выпадает конденсат, появляется плесень.</p><div class="kbfigs">${kbNode('cold')}${kbNode('warm')}</div>`},
  {t:'Тёплый угол',h:`<p>Вместо дополнительной стойки у внутренней грани проходящей стены ставят <b>доску 45×100 плашмя</b>. Её края дают опору для крепления внутренней отделки обеих стен, а полость за ней остаётся открытой — утеплитель идёт сплошным слоем до наружного угла.</p>${PDFN('синие элементы (доски 100×45, марки П…) в торцах стен — это и есть тёплые углы (листы 16–26).')}`,src:['pdf','sp31105']},
  {t:'Тёплое Т-примыкание перегородки',h:`<p>Перегородку к наружной стене крепят не к сквозной стойке на всю толщину, а к <b>двум доскам 45×100 плашмя</b> у внутренней грани (общая ширина 200 мм — опора для торцевой стойки перегородки и отделки по обе стороны). Утеплитель за досками сплошной.</p><div class="kbfigs">${kbNode('tcold')}${kbNode('twarm')}</div>${PDFN('пары синих досок П20 (100×45) в местах примыкания перегородок (лист 19).')}`,src:['pdf']},
  {t:'Как это делает конструктор',h:`<p>Настройка «Углы и примыкания стен» (шаг «Каркас стен»): <b>тёплый угол</b> — доски плашмя в углах стен 1 и 3 и по две доски в местах примыкания перегородок (если в этом месте уже стоит стойка, она используется как опора); <b>классический</b> — дополнительные стойки. Доски тёплых узлов видны синим в 3D и на развёртках и входят в спецификацию.</p>`},
  {t:'Примыкание стен к перекрытию',h:PDFN('под стенами, идущими поперёк балок, ставят блок-балки (П1.03, П1.04), между балками — распорки, под стеной — распорки П1.06; обвязочная доска перекрытия прибивается гвоздями с шагом не более 450 мм (П1.01).'),src:['pdf']}
 ]},
 {id:'k9',t:'9. Утепление и пароизоляция',s:[
  {t:'Пирог стены',h:`${kbPie()}<p>Правило: паропроницаемость слоёв должна <b>расти изнутри наружу</b>. Пароизоляция — с тёплой стороны, швы проклеены; снаружи — паропроницаемая мембрана или ветрозащитная ДВП; затем вентзазор 25–50 мм, который выносит влагу. Перепутанные слои дают конденсат в утеплителе.</p>`,src:['sp50','sp31105']},
  {t:'Толщина и монтаж утеплителя',h:`<p>Для средней полосы России 150 мм — минимум, лучше 200 мм (стойка 45×195 или 150 + 50 перекрёстного слоя). Минвата плотностью 35–45 кг/м³ ставится враспор: ячейка на 10 мм уже плиты (590 под 600). Швы двух слоёв разносят.</p>${PDFN('в сводных данных (лист 34) объём утеплителя каркаса считается с коэффициентом 0,9 (за вычетом объёма дерева), дополнительные слои 50 мм — с коэффициентом 1.')}`,src:['sp50','pdf']},
  {t:'Инсталляционный слой',h:`<p>Обрешётка 45×45 с шагом 600 поверх пароизоляции и утеплитель 50 мм между ней. В этом слое прокладывают проводку, не прокалывая пароизоляцию. Обязателен в финской технологии.</p>`,src:['a_olla','a_brutal']}
 ]},
 {id:'k10',t:'10. Кровля и мансарда',s:[
  {t:'Стропильная система',h:`<p>Конструктор строит висячую систему: балки перекрытия работают затяжками и гасят распор, стропила соединяются с ними в нижнем узле. Стропила считаются на изгиб и прогиб L/200 от снега, веса кровли и ветра. При одинарной обвязке стропила ставятся над стойками.</p><table><tr><th>Покрытие</th><th>Мин. уклон</th><th>Обрешётка</th></tr><tr><td>Металлочерепица</td><td>14°</td><td>25×100 шаг 350 + контробрешётка 50×50</td></tr><tr><td>Профнастил</td><td>12°</td><td>25×100 шаг 400</td></tr><tr><td>Гибкая черепица</td><td>12°</td><td>сплошная OSB-3 12 мм</td></tr><tr><td>Ондулин</td><td>6°</td><td>50×50 шаг 600</td></tr></table>`,src:['sp20','sp64']},
  {t:'Мансарда',h:`<p>Стенка мансарды — промежуточная опора стропил, нагрузка от неё идёт на балку перекрытия сосредоточенной силой (проверяется). Ригели под потолком; утепление — по скатам до ригелей и по потолку. Для мансарды уклон 40–45°, иначе полезная ширина мала. Площадь считается с высотой от 1,5 м.</p>`},
  {t:'Отрыв кровли ветром',h:`<p>Отсос на скате (c ≈ −0,6) может превысить вес лёгкой кровли — стропила крепят к обвязке уголком и скобой, в ветреных районах — дополнительно скруткой к стойке. Конструктор считает отрывающую силу и количество креплений на узел.</p>`,src:['sp20']}
 ]},
 {id:'k11',t:'11. Расчётные формулы конструктора',s:[
  {t:'Сводка',h:`<table><tr><th>Проверка</th><th>Формула</th><th>Источник</th></tr>
   <tr><td>Изгиб</td><td>σ = M/W ≤ Rи = 13 МПа;  M = qL²/8 (неразрезная — qL²/10)</td><td>СП 64, СНиП II-25-80</td></tr>
   <tr><td>Прогиб</td><td>f = 5qL⁴/(384EI), E = 10 000 МПа; пол L/250, кровля L/200</td><td>СП 64, СП 20</td></tr>
   <tr><td>Сосредоточенная сила</td><td>M += P·a·(L−a)/L;  f += P·b·(L²−b²)^1,5 / (9√3·L·EI)</td><td>строительная механика</td></tr>
   <tr><td>Стойки</td><td>N/(φ·A·Rc) + M/(W·Rи) ≤ 1;  φ = 1−0,8(λ/100)² при λ ≤ 70, 3000/λ² при λ > 70; λ ≤ 120</td><td>СП 64</td></tr>
   <tr><td>Гвоздь</td><td>T = min(0,35·c·d;  2,5d² + 0,01a² ≤ 4d²), кН (d, c, a — см)</td><td>СП 64</td></tr>
   <tr><td>Составной пакет</td><td>W полный, стыки вразбежку над опорами</td><td>СП 64</td></tr>
   <tr><td>Сваи ЖБ</td><td>Fd = R·A + u·Σγcf·fi·hi;  N ≤ Fd/1,4</td><td>СП 24</td></tr>
   <tr><td>Пучение</td><td>τ·u·df − 0,9N ≤ Fанкер</td><td>СП 22, СП 24</td></tr>
   <tr><td>Промерзание</td><td>d = d₀·√Mt</td><td>СП 22</td></tr>
   <tr><td>Снег</td><td>S = Sg·μ, γf = 1,4</td><td>СП 20</td></tr>
   <tr><td>Ветер</td><td>w = w0·k·c, γf = 1,4;  w0 = 0,43·V²</td><td>СП 20</td></tr>
   <tr><td>Обшивка на сдвиг</td><td>R = fv·b·min(1; b/(h/2)), b ≥ h/4</td><td>EN 1995-1-1</td></tr>
   <tr><td>Укосина</td><td>H = min(Nсж·φ; Nраст; n·Tгв)·cos α, α = 45…60°</td><td>СП 64, СП 31-105</td></tr>
   <tr><td>Опрокидывание</td><td>ΔN = F·h / (B·n) − 0,9·Nпост ≤ Fанкер</td><td>статика</td></tr>
   <tr><td>Климат</td><td>x₅₀ = x̄ + 2,59σ (Гумбель)</td><td>статистика экстремумов</td></tr></table>`,src:['sp64','sp20','sp24','sp22','ec5','snip25']}
 ]},
 {id:'k12',t:'12. Чертежи, спецификация и раскрой',s:[
  {t:'Марки и спецификация',h:`<p>Одинаковые детали (группа, роль, сечение, длина) получают одну марку: С — стойки, СП — опорные стойки, СК — укороченные, ПР — перемычки, Р — ригели, НО/ВО — обвязки, УК — укосины, УТ — доски тёплых узлов, ИО — инсталляционная обрешётка, Б — ростверк, Л — лаги, БП — балки перекрытия, СН — стропила, РГ — ригели мансарды, ОР/КР — обрешётка и контробрешётка. Марки совпадают на чертежах, в 3D и в спецификации.</p>`},
  {t:'Раскрой',h:`<p>Длинные детали делятся на части со стыком над опорой (стойкой, сваей, стропилом). Детали раскладываются по доскам складских длин (из базы материалов) алгоритмом «наилучшее заполнение с убыванием», затем каждая доска заменяется на самую короткую из подходящих; из нескольких вариантов выбирается с минимальным расходом.</p>`},
  {t:'Чертежи и экспорт',h:`<p>Листы A3 по ГОСТ 21.101 (упрощённый штамп): общие данные, сваи, ростверк, план стен, план мансарды, развёртки всех стен и фронтонов, стропильная система с разрезом. DXF — геометрия в натуральную величину, мм, по слоям, кодировка Windows-1251; Excel — спецификация, закупка, раскрой, смета, сваи, проверки, жёсткость стен.</p>`,src:['gost21101']}
 ]}
]}
function renderKB(){
  const el=$('#tab-kb'),book=KBOOK(),q=(el.dataset.q||'').trim().toLowerCase();
  const strip=h=>h.replace(/<[^>]+>/g,' ');
  const match=sec=>!q||(sec.t+' '+strip(sec.h)).toLowerCase().includes(q);
  let toc='',body='';
  book.forEach(ch=>{const secs=ch.s.filter(match);if(!secs.length)return;
    toc+=`<li><a href="#${ch.id}" data-go="${ch.id}">${esc(ch.t)}</a><ol>${secs.map((s,i)=>`<li><a href="#${ch.id}-${i}" data-go="${ch.id}-${ch.s.indexOf(s)}">${esc(s.t)}</a></li>`).join('')}</ol></li>`;
    body+=`<div class="kbch" id="${ch.id}"><h2>${esc(ch.t)}</h2>${secs.map(s=>`<div class="kbsec" id="${ch.id}-${ch.s.indexOf(s)}"><h3>${esc(s.t)}</h3>${s.h}${s.src?`<div class="src">Источники: ${s.src.map(k=>{const r=KSRC[k];return r?(r.u?`<a href="${r.u}" target="_blank" rel="noopener">${esc(r.t)}</a>`:esc(r.t)):''}).join('; ')}</div>`:''}</div>`).join('')}</div>`});
  if(!body)body=`<p class="lead">По запросу «${esc(q)}» ничего не найдено.</p>`;
  if(!q)body+=`<div class="kbch" id="k13"><h2>13. Источники</h2><div class="kbsec"><ol>${Object.values(KSRC).map(r=>`<li>${r.u?`<a href="${r.u}" target="_blank" rel="noopener">${esc(r.t)}</a>`:esc(r.t)}</li>`).join('')}</ol><p class="src">Нормативные документы приведены по названиям; конкретные пункты и таблицы указаны в разделах. Значения несущей способности креплений и обшивки — типовые, сверяйте с паспортами изделий.</p></div></div>`;
  el.innerHTML=`<div class="sec-head"><h2>База знаний</h2></div><p class="lead">Учебник по всему, что использует конструктор: технологии, материалы, нагрузки, формулы, узлы и источники. Схемы и примеры из проекта проектировщика отмечены синей полосой.</p>
  <div class="kbw"><nav class="kbtoc" aria-label="Оглавление"><label for="kbq" class="note">Поиск по базе знаний</label><input id="kbq" type="search" value="${esc(el.dataset.q||'')}" placeholder="например, тёплый угол"><ol>${toc}${q?'':'<li><a href="#k13" data-go="k13">13. Источники</a></li>'}</ol></nav><div class="kbbody">${body}</div></div>`;
